<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VoltForge｜公司经营模拟</title>
<style>
:root{--g:#147a58;--d:#103b30;--m:#e9f5ef;--bg:#f4f6f5;--ink:#17221d;--mut:#68766f;--line:#dbe5df;--red:#b33b46;--amber:#a86613}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.hide{display:none!important}.wrap{width:min(1120px,calc(100% - 28px));margin:auto}.btn{border:0;border-radius:10px;background:var(--g);color:white;padding:11px 17px;font-weight:750}.btn.alt{background:white;color:var(--g);border:1px solid #8bb8a6}.btn.danger{background:var(--red)}.btn.sm{padding:7px 9px;font-size:12px}.btn:disabled{opacity:.42;cursor:not-allowed}.brand{font-size:21px;font-weight:900}.cover{min-height:100vh;background:radial-gradient(circle at 78% 18%,#27785b 0,transparent 24%),linear-gradient(135deg,#092d24,#124e3c);color:white;display:grid;place-items:center}.coverin{width:min(1120px,calc(100% - 36px));display:grid;grid-template-columns:1.15fr .85fr;gap:55px;align-items:center;padding:60px 0}.cover h1{font-size:clamp(43px,6vw,75px);line-height:1.03;margin:40px 0 18px}.cover p{color:#d1e8de;font-size:18px;line-height:1.8}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}.cover .btn{background:white;color:var(--d);padding:14px 21px}.cover .btn.alt{background:transparent;color:white;border-color:#79a393}.covercard{background:#ffffff16;border:1px solid #ffffff30;border-radius:22px;padding:24px}.roundmini{display:block;background:#ffffff12;padding:12px 14px;border-radius:11px;margin:8px 0;min-width:0}.roundmini b{display:block;white-space:normal;word-break:keep-all;line-height:1.4}.roundmini small{display:block;color:#cce1d8;line-height:1.55;margin-top:3px;white-space:normal;word-break:normal}.auth{min-height:100vh;display:grid;grid-template-columns:.75fr 1.25fr;background:white}.authside{background:var(--d);color:white;padding:45px;display:flex;flex-direction:column;justify-content:space-between}.authside p{color:#bdd7cc;line-height:1.75}.authmain{display:grid;place-items:center;padding:35px}.authbox{width:min(500px,100%)}.tabs{display:flex;background:#f0f4f2;padding:5px;border-radius:11px;margin:20px 0}.tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:8px}.tabs button.on{background:white;box-shadow:0 2px 8px #00000010}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:750;margin-bottom:6px}.field input,.field textarea{width:100%;padding:12px;border:1px solid #b8c8c0;border-radius:10px}.passwrap{position:relative}.passwrap input{padding-right:70px}.passbtn{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--g);font-size:12px;font-weight:750;padding:6px}.field textarea{min-height:80px}.err,.note{padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.6}.err{background:#fff0f1;color:var(--red)}.note{background:#fff7e8;color:#79501a}.note.ok{background:var(--m);color:var(--g)}.bar{background:var(--d);color:white;position:sticky;top:0;z-index:10}.barin{min-height:66px;display:flex;justify-content:space-between;align-items:center}.stats{background:white;border-bottom:1px solid var(--line)}.statsin{min-height:66px;display:flex;gap:28px;align-items:center;overflow:auto}.stat{white-space:nowrap}.stat span{display:block;color:var(--mut);font-size:11px;margin-bottom:4px}.layout{display:grid;grid-template-columns:210px 1fr;gap:22px;padding:23px 0 45px}.side{display:grid;align-content:start;gap:6px}.side button{border:0;background:transparent;text-align:left;color:var(--mut);padding:11px 12px;border-radius:9px;font-weight:680}.side button.on{background:var(--m);color:var(--g)}.head{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;margin-bottom:16px}.head h1{margin:0 0 5px;font-size:28px}.head p{margin:0;color:var(--mut);line-height:1.55}.tag{padding:5px 8px;border-radius:99px;background:#fff7e8;color:var(--amber);font-size:11px;font-weight:800}.tag.ok{background:var(--m);color:var(--g)}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:19px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric small{color:var(--mut)}.metric strong{font-size:23px;display:block;margin-top:6px}.event{background:linear-gradient(135deg,#103b30,#176149);color:white;border-radius:18px;padding:23px;margin-bottom:14px}.event h2{font-size:24px;margin:7px 0}.event p{color:#d2e6dd;line-height:1.65;margin:0}.market{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.market div{border:1px solid var(--line);border-radius:11px;padding:13px}.market small{color:var(--mut)}.market b{display:block;margin-top:5px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:13px}.steps div{background:white;border:1px solid var(--line);border-radius:13px;padding:15px}.steps b{width:27px;height:27px;border-radius:50%;background:var(--m);color:var(--g);display:grid;place-items:center}.steps h3{font-size:14px}.steps p{font-size:12px;color:var(--mut);line-height:1.6}.decisions{display:grid;gap:10px}.decision{background:white;border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:1fr 180px;gap:18px;align-items:center}.decision h3{font-size:15px;margin:0 0 6px}.decision p{font-size:12px;color:var(--mut);line-height:1.55;margin:0}.decision input{width:100%;padding:11px;border:1px solid #b8c8c0;border-radius:9px}.effect{color:var(--g);display:block;margin-top:4px}.unit{text-align:right;font-size:11px;color:var(--mut);margin-top:4px}.budget{background:var(--d);color:white;border-radius:13px;padding:14px 17px;margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:15px;position:sticky;bottom:10px}.budget small{color:#c8ded5}.budget strong{display:block;font-size:19px;margin-top:4px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid var(--line);font-size:12px;text-align:left;white-space:nowrap}th{color:var(--mut)}td:last-child,th:last-child{text-align:right}.empty{text-align:center;padding:45px;color:var(--mut)}.reporttabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.reporttabs button{border:1px solid var(--line);background:white;border-radius:8px;padding:8px 10px}.reporttabs button.on{background:var(--g);color:white}.pane{display:none}.pane.on{display:block}.chart{width:100%;height:230px;border:1px solid var(--line);border-radius:12px}.rank{display:grid;grid-template-columns:38px 1fr 120px 120px;gap:8px;padding:11px;border-bottom:1px solid var(--line)}.rank.me{background:var(--m)}.adminlayout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 66px)}.adminside{background:#153a2e;padding:18px 12px}.adminside button{color:#bdd3ca;width:100%}.adminside button.on{background:#285445;color:white}.adminmain{padding:24px;min-width:0}.adminstats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:14px}.modal{position:fixed;inset:0;background:#071b1588;display:grid;place-items:center;padding:20px;z-index:50}.modalbox{background:white;border-radius:16px;padding:21px;width:min(500px,100%)}.modalacts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.good{color:var(--g)}.bad{color:var(--red)}
@media(max-width:850px){.coverin{grid-template-columns:1fr}.covercard{display:none}.auth{grid-template-columns:1fr}.authside{display:none}.layout,.adminlayout{grid-template-columns:1fr}.side,.adminside{display:flex;overflow:auto;padding:9px}.side button{white-space:nowrap}.cards,.adminstats{grid-template-columns:repeat(2,1fr)}.market{grid-template-columns:repeat(2,1fr)}.steps{grid-template-columns:1fr}.rank{grid-template-columns:35px 1fr auto}.rank span:last-child{display:none}}@media(max-width:600px){.cards,.adminstats{grid-template-columns:1fr}.decision{grid-template-columns:1fr}.budget,.head{align-items:flex-start;flex-direction:column}.adminmain{padding:16px 14px}.cover h1{font-size:44px}.authmain{padding:25px 17px}}
</style></head><body>
<section id="cover" class="cover"><div class="coverin"><div><div class="brand">⚡ VoltForge</div><h1>把一家公司<br>真正经营起来</h1><p>经营同一种储能电池。每轮面对新的市场变化，决定生产、定价与资金分配，用真实财务结果和其他公司竞争。</p><div class="actions"><button class="btn" onclick="toAuth('reg')">创建公司</button><button class="btn alt" onclick="toAuth('login')">团队登录</button><button class="btn alt" onclick="toAuth('admin')">管理员入口</button></div></div><div class="covercard"><h2>八轮经营挑战</h2><div id="coverRounds"></div></div></div></section>
<section id="auth" class="auth hide"><aside class="authside"><div><div class="brand">⚡ VoltForge</div><h1>从第一笔决定开始</h1><p>每一笔支出进入现金流，每轮都会生成真实利润表、资产负债表和现金流量表。</p></div><small>所有公司共享同一套服务器数据；刷新或更换设备后，使用公司名称和团队密码即可继续。</small></aside><main class="authmain"><div class="authbox"><button class="btn alt sm" onclick="screen('cover')">← 返回封面</button><h1 id="authTitle">创建公司</h1><div class="tabs"><button data-at="reg" onclick="authTab('reg')">创建公司</button><button data-at="login" onclick="authTab('login')">团队登录</button><button data-at="admin" onclick="authTab('admin')">管理员</button></div><div id="authErr" class="err hide"></div>
<form id="regForm" onsubmit="register(event)"><div class="field"><label>活动邀请码</label><input id="invite" required inputmode="numeric" placeholder="请输入6位邀请码"></div><div class="field"><label>公司名称</label><input id="newName" required maxlength="20" placeholder="例如：青岚能源"></div><div class="field"><label>团队成员</label><input id="members" required placeholder="例如：张三、李四、王五"></div><div class="field"><label>设置团队密码</label><div class="passwrap"><input id="newPass" required type="password" minlength="6" placeholder="至少6位"><button type="button" class="passbtn" onclick="togglePassword('newPass',this)">显示</button></div></div><button class="btn" style="width:100%">创建并进入</button></form>
<form id="loginForm" class="hide" onsubmit="teamLogin(event)"><div class="field"><label>公司名称</label><input id="loginName" required></div><div class="field"><label>团队密码</label><div class="passwrap"><input id="loginPass" required type="password"><button type="button" class="passbtn" onclick="togglePassword('loginPass',this)">显示</button></div></div><button class="btn" style="width:100%">登录公司</button></form>
<form id="adminForm" class="hide" onsubmit="adminLogin(event)"><div class="field"><label>管理员密码</label><div class="passwrap"><input id="adminPass" required type="password"><button type="button" class="passbtn" onclick="togglePassword('adminPass',this)">显示</button></div></div><button class="btn" style="width:100%">进入管理后台</button></form></div></main></section>
<section id="student" class="hide"><header class="bar"><div class="wrap barin"><div class="brand">⚡ VoltForge</div><div><span id="roundPill"></span>　<button class="btn alt sm" onclick="logout()">退出</button></div></div></header><div class="stats"><div class="wrap statsin"><div class="stat"><span>公司</span><b id="stName"></b></div><div class="stat"><span>可用现金</span><b id="stCash"></b></div><div class="stat"><span>总资产</span><b id="stAssets"></b></div><div class="stat"><span>公司估值</span><b id="stValue"></b></div><div class="stat"><span>本轮状态</span><b id="stStatus"></b></div></div></div><div class="wrap layout"><nav class="side"><button data-sp="home" onclick="studentPage('home')">本轮首页</button><button data-sp="decision" onclick="studentPage('decision')">经营决策</button><button data-sp="intel" onclick="studentPage('intel')">竞争情报</button><button data-sp="result" onclick="studentPage('result')">经营结果</button><button data-sp="reports" onclick="studentPage('reports')">财务报表</button><button data-sp="trend" onclick="studentPage('trend')">估值与排名</button></nav><main id="studentMain"></main></div></section>
<section id="admin" class="hide"><header class="bar"><div class="wrap barin"><div class="brand">⚡ VoltForge 管理后台</div><div><span id="adminPill"></span>　<button class="btn alt sm" onclick="logout()">退出</button></div></div></header><div class="adminlayout"><nav class="side adminside"><button data-ap="dash" onclick="adminPage('dash')">总览</button><button data-ap="round" onclick="adminPage('round')">轮次与事件</button><button data-ap="teams" onclick="adminPage('teams')">公司与提交</button><button data-ap="settle" onclick="adminPage('settle')">统一结算</button><button data-ap="ranking" onclick="adminPage('ranking')">排名与分析</button><button data-ap="export" onclick="adminPage('export')">导出与重置</button></nav><main id="adminMain" class="adminmain"></main></div></section><div id="modal" class="modal hide"></div>
<script src="/client.js" defer></script></body></html>
